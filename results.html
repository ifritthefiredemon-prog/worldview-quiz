<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Worldview Results</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="results-page">

    <div class="results-container">

        <header class="results-header">

            <img src="images/logo.png" class="results-logo" alt="Worldview Compass">

            <h1>Your Worldview Compass</h1>

            <p class="results-subtitle">
                Your assessment has been completed successfully.
                Below is a personalized analysis of your philosophical worldview.
            </p>

        </header>

        <!-- Primary Philosophy -->

        <section class="primary-card">

            <div class="primary-badge">
                Primary Philosophy
            </div>

            <h2 id="primaryName">
                Loading...
            </h2>

            <p id="primaryDescription">
                Calculating your worldview...
            </p>

        </section>

        <!-- Top Philosophies -->

        <section>

            <h2 class="section-title">
                Top Three Philosophies
            </h2>

            <div id="topThree" class="top-grid">

            </div>

        </section>

        <!-- Radar Chart -->

        <section>

            <h2 class="section-title">
                Worldview Profile
            </h2>

            <div class="chart-card">

                <canvas id="radarChart"></canvas>

            </div>

        </section>

        <!-- All Scores -->

        <section>

            <h2 class="section-title">
                Philosophy Scores
            </h2>

            <div id="scoreList">

            </div>

        </section>

        <!-- Buttons -->

        <div class="results-buttons">

            <button onclick="location.href='index.html'">

                Take Assessment Again

            </button>

        </div>

    </div>

</div>

<script src="results.js"></script>

</body>

</html>
