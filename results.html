<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Worldview Results</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="results-page">

    <div class="results-container">

        <h1>🧭 Your Worldview Compass</h1>

        <p class="results-subtitle">
            Based on your responses, these philosophies most closely
            reflect your worldview.
        </p>

        <!-- Main Philosophy -->

        <div class="primary-card">

            <h2 id="primaryName">Loading...</h2>

            <p id="primaryDescription">
                Calculating your worldview...
            </p>

        </div>

        <!-- Top Three -->

        <h2 class="section-title">Top Philosophies</h2>

        <div id="topThree"></div>

        <!-- All Scores -->

        <h2 class="section-title">Overall Scores</h2>

        <div id="scoreList"></div>

        <div class="results-buttons">

            <button onclick="location.href='index.html'">
                Retake Assessment
            </button>

        </div>

    </div>

</div>

<script src="results.js"></script>

</body>
</html>
